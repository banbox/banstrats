# Overlay for an existing database/exchange/account configuration.
# Point-in-time rolling liquidity universe + risk-parity (ERC) sizing + drift buffer.
# The root `pairs` list is the candidate superset: every 30 days the 30 most liquid contracts
# (30-day kline quote volume visible at that time, listed for >= 14 days) form the investable
# universe; dropped names are closed on the next decision. BTC and ETH are always kept.
run_timeframes: [1d]
data:
  pit_policy: static-approximation
execution:
  mode: weights
  funding_policy: explicit-zero
run_policy:
  - name: CSLiquidTopERC
    engine: factor
    run_timeframes: [1d]
    universe:
      mode: rolling_liquid_top
      top_n: 30
      lookback_days: 30
      min_listing_days: 14
      reconstitute_days: 30
      always_include: ['BTC/USDT:USDT', 'ETH/USDT:USDT']
    expressions:
      schema_version: 1
      timeframe: 1d
      bindings:
        kline: {source: kline, timeframe: 1d}
      params: {momentum_window: 20, skip: 1, volatility_window: 20}
      lets:
        price: 'positive(kline.close)'
        momentum: 'ts.return(ts.lag(factor.price, param.skip), param.momentum_window)'
        sigma: 'ts.std(ts.return(factor.price, 1), param.volatility_window, 0)'
      outputs:
        risk_adjusted: 'cs.zscore(factor.momentum / max(factor.sigma, 1e-6))'
        # Reserved column: bound to the portfolio risk context (inverse-volatility fallback while
        # the ERC covariance window is still filling). Excluded from the score automatically.
        volatility: 'factor.sigma'
    prices: {source: kline, timeframe: 1m, field: close}
    decision: {latency_ms: 1, expiry_ms: 120000}
    portfolio:
      policy: lifecycle-v1
      mode: full
      long_notional: 0.5
      short_notional: 0.5
      selection: {long_k: 5, short_k: 5}
      # Re-optimise every 3 days; a held weight within 2% of target is left untouched (no orders, no fees).
      rebalance: {every_bars: 3, drift_threshold: 0.02}
      # Equal risk contribution per side from a 60-bar covariance, 10% off-diagonal shrinkage.
      allocation: {method: erc, risk_window: 60, shrinkage: 0.1, reserve_ratio: 0.02, asset_cap: 0.15}
    manifest:
      costs: {fee_rate: 0.0005, slippage_rate: 0.0005, funding_policy: explicit-zero}
    research: {labels: []}
