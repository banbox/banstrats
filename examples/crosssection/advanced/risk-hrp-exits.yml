# Overlay for an existing database/exchange/account configuration.
# Hierarchical risk parity sizing with hybrid exits: a per-position stop loss and a trailing
# stop run on every decision (also between rebalances) and block re-entry for 2 bars.
run_timeframes: [1d]
data:
  pit_policy: static-approximation
execution:
  mode: weights
  funding_policy: explicit-zero
run_policy:
  - name: CSMomentum
    id: cs-hrp-exits
    engine: factor
    run_timeframes: [1d]
    params: {momentum_window: 30, skip: 1}
    prices: {source: kline, timeframe: 1m, field: close}
    decision: {latency_ms: 1, expiry_ms: 120000}
    portfolio:
      policy: lifecycle-v1
      mode: full
      long_notional: 0.5
      short_notional: 0.5
      selection: {long_k: 4, short_k: 4}
      rebalance: {every_bars: 5}
      holding:
        stop_loss_pct: 0.1
        trailing_stop_pct: 0.15
        cooldown_bars: 2
        # BTC is held through ordinary drawdowns: explicit zero removes the trailing stop for it.
        by_asset:
          'BTC/USDT:USDT': {trailing_stop_pct: 0}
      allocation: {method: hrp, risk_window: 90, shrinkage: 0.2, drift_threshold: 0.03}
    manifest:
      costs: {fee_rate: 0.0005, slippage_rate: 0.0005, funding_policy: explicit-zero}
    research: {labels: []}
