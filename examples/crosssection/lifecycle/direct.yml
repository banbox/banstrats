# Strategy overlay: combine with your own market/database runtime.yml.
run_timeframes: [2h]
data: {pit_policy: static-approximation}
execution: {mode: weights, funding_policy: explicit-zero}
run_policy:
  - name: CSMomentum
    engine: factor
    run_timeframes: [2h]
    params: {momentum_window: 20, skip: 1}
    prices: {source: kline, timeframe: 1m, field: close}
    decision: {latency_ms: 1, expiry_ms: 120000}
    portfolio:
      policy: lifecycle-v1
      mode: full
      long_notional: 0.5
      short_notional: 0.5
      rebalance: {every_bars: 1}
      selection: {long_k: 3, short_k: 2, retain_rank: 4, dropout: 2}
      holding: {min_bars: 8, max_bars: 24, cooldown_bars: 2}
      transition: {mode: direct}
      allocation: {method: equal}
    manifest:
      costs: {fee_rate: 0.0005, slippage_rate: 0.0005, funding_policy: explicit-zero}
    research: {labels: []}
